<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">
    <link rel="manifest" href="manifest.json">
    <title>AutoTools</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
        body{font-family:Arial,sans-serif;background:#1a1a1a;color:#fff;padding:10px;-webkit-font-smoothing:antialiased}
        .header{background:#0066cc;padding:15px;margin:-10px -10px 20px -10px;text-align:center}
        .tab-buttons{display:flex;gap:5px;margin-bottom:20px}
        .tab-btn{padding:15px;background:#333;border:none;color:#fff;font-size:16px;flex:1;cursor:pointer}
        .tab-btn.active{background:#0066cc}
        .tab-content{display:none}.tab-content.active{display:block}
        .converter{background:#2a2a2a;padding:20px;border-radius:10px;margin-bottom:20px}
        input,select,textarea{width:100%;padding:15px;font-size:18px;margin:10px 0;background:#333;border:1px solid #555;color:#fff;border-radius:5px;-webkit-appearance:none}
        input:focus{outline:2px solid #0066cc;border-color:#0066cc}
        button{background:#0066cc;color:#fff;border:none;padding:15px;font-size:16px;cursor:pointer;border-radius:5px;width:100%;margin:5px 0}
        button.calculate{background:#ff6600;font-weight:bold;font-size:18px}
        button.add{background:#00aa00;margin-bottom:20px}
        button.delete{background:#aa0000}
        .result{background:#0066cc;padding:20px;margin:10px 0;font-size:22px;text-align:center;border-radius:5px}
        .result.empty{background:#444;color:#888}
        .machine-card{background:#333;padding:15px;margin:10px 0;border-radius:5px;border-left:4px solid #0066cc}
        .machine-card h3{color:#00aa00;margin-bottom:10px}
        .copy-btn{background:#555;padding:5px 10px;margin-left:10px;font-size:14px;width:auto}
        .button-row{display:flex;gap:10px;margin:10px 0}
        .button-row button{flex:1}
    </style>
</head>
<body>
    <div class="header">
        <h1>🔧 AutoTools</h1>
        <small>Narzędzia automatyka</small>
    </div>

    <div class="tab-buttons">
        <button class="tab-btn active" onclick="switchTab('converters')">Przeliczniki</button>
        <button class="tab-btn" onclick="switchTab('machines')">Maszyny</button>
        <button class="tab-btn" onclick="switchTab('tools')">Narzędzia</button>
    </div>

    <!-- PRZELICZNIKI -->
    <div id="converters" class="tab-content active">
        <div class="converter">
            <h2>📊 Ciśnienie</h2>
            <input type="text" inputmode="decimal" id="barInput" placeholder="Wartość w Bar">
            <button class="calculate" onclick="convertPressure()">PRZELICZ</button>
            <div class="result empty">Pa: <span id="paResult">-</span></div>
            <div class="result empty">PSI: <span id="psiResult">-</span></div>
            <div class="result empty">MPa: <span id="mpaResult">-</span></div>
        </div>

        <div class="converter">
            <h2>💨 Przepływ</h2>
            <input type="text" inputmode="decimal" id="flowInput" placeholder="Wartość">
            <select id="flowUnit">
                <option value="m3h">m³/h</option>
                <option value="lmin">l/min</option>
                <option value="cfm">CFM</option>
            </select>
            <button class="calculate" onclick="convertFlow()">PRZELICZ</button>
            <div class="result empty">m³/h: <span id="m3hResult">-</span></div>
            <div class="result empty">l/min: <span id="lminResult">-</span></div>
            <div class="result empty">CFM: <span id="cfmResult">-</span></div>
        </div>
    </div>

    <!-- MASZYNY -->
    <div id="machines" class="tab-content">
        <button class="add" onclick="showAddMachine()">+ DODAJ MASZYNĘ</button>
        <div id="addMachineForm" style="display:none;" class="converter">
            <h3>Nowa maszyna</h3>
            <input type="text" id="machName" placeholder="Nazwa maszyny">
            <input type="text" id="machIP" placeholder="Adres IP">
            <input type="text" id="machPLC" placeholder="Typ PLC">
            <input type="text" id="machLocation" placeholder="Lokalizacja">
            <textarea id="machNotes" placeholder="Notatki..." rows="3"></textarea>
            <div class="button-row">
                <button onclick="saveMachine()">ZAPISZ</button>
                <button class="delete" onclick="hideAddMachine()">ANULUJ</button>
            </div>
        </div>
        <input type="text" id="searchMachine" placeholder="🔍 Szukaj..." oninput="searchMachines()">
        <div id="machineList"></div>
    </div>

    <!-- NARZĘDZIA -->
    <div id="tools" class="tab-content">
        <div class="converter">
            <h2>⚡ Dobór kabla</h2>
            <input type="text" inputmode="decimal" id="powerKW" placeholder="Moc [kW]">
            <select id="voltage">
                <option value="400">3x400V</option>
                <option value="230">230V</option>
            </select>
            <input type="text" inputmode="decimal" id="cableLength" placeholder="Długość [m]">
            <button class="calculate" onclick="calculateCable()">OBLICZ</button>
            <div class="result empty" id="cableResult">-</div>
        </div>

        <div class="converter">
            <h2>📐 Przekroje</h2>
            <select id="cableType" onchange="showCableInfo()">
                <option value="">Wybierz...</option>
                <option value="1.5">1.5 mm²</option>
                <option value="2.5">2.5 mm²</option>
                <option value="4">4 mm²</option>
                <option value="6">6 mm²</option>
                <option value="10">10 mm²</option>
                <option value="16">16 mm²</option>
            </select>
            <div class="result empty" id="cableInfo">-</div>
        </div>

        <!-- ===== NOWY KALKULATOR – POJEMNOŚĆ ZBIORNIKA ===== -->
        <!-- ===== NOWY KALKULATOR – POJEMNOŚĆ ZBIORNIKA ===== -->
            <!-- ===== NOWY KALKULATOR – POJEMNOŚĆ ZBIORNIKA ===== -->
        <div class="converter">
            <h2>🛢️ Pojemność zbiornika</h2>

            <select id="tankShape" onchange="toggleCone()">
                <option value="cyl">Tylko cylindryczny</option>
                <option value="cylcone">Cylinder + stożek (dno)</option>
            </select>

            <input type="text" inputmode="decimal" id="tankD" placeholder="Średnica całkowita [cm]">
            <input type="text" inputmode="decimal" id="tankH" placeholder="Wysokość cylindra [cm]">
            <input type="text" inputmode="decimal" id="coneH" placeholder="Wysokość stożka [cm]">

            <button class="calculate" onclick="calcTank()">OBLICZ</button>
            <div class="result empty" id="tankResult">-</div>
        </div>
        <div class="converter">
            <h2>💾 Backup danych</h2>
                    <!-- ===== PRAWO OHMA – DOBÓR STYCZNIKA ===== -->
        <div class="converter">
            <h2>⚡ Silnik → prąd → stycznik</h2>

            <input type="text" inputmode="decimal" id="motorPower" placeholder="Moc silnika [kW]">
            <select id="motorVoltage">
                <option value="400">3×400 V</option>
                <option value="230">1×230 V</option>
            </select>
            <select id="motorEff">
                <option value="0.75">Sprawność ≈ 75 %</option>
                <option value="0.8">Sprawność ≈ 80 %</option>
                <option value="0.85">Sprawność ≈ 85 %</option>
                <option value="0.9">Sprawność ≈ 90 %</option>
            </select>
            <select id="motorPF">
                <option value="0.8">cos φ ≈ 0,80</option>
                <option value="0.85">cos φ ≈ 0,85</option>
                <option value="0.88">cos φ ≈ 0,88</option>
                <option value="0.9">cos φ ≈ 0,90</option>
            </select>

            <button class="calculate" onclick="calcMotor()">OBLICZ</button>
            <div class="result empty" id="motorResult">-</div>
        </div>
        <div class="converter">
            <h2>💾 Backup danych</h2>
            <button onclick="backupData()">EKSPORTUJ DANE</button>
            <button onclick="document.getElementById('importFile').click()">IMPORTUJ DANE</button>
            <input type="file" id="importFile" style="display:none;" onchange="importData(this.files[0])">
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
